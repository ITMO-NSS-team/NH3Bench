[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nh3bench"
version = "0.1.0"
description = "Benchmark for real-time LLM control of an industrial ammonia (NH3) refrigeration plant serving a food-processing workshop"
readme = "README.md"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Nikolay Nikitin" }]
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=7", "anthropic>=0.40"]

[project.scripts]
nh3bench = "nh3bench.__main__:main"

[tool.setuptools.packages.find]
include = ["nh3bench*"]
