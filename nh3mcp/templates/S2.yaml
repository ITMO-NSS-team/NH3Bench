truth:
  title: 'Два фронта: утечка в машзале и слепой уровнемер'
  hazard: 'Две независимые причины. Первая, громкая: фланцевая утечка со стороны ВД в машзале, около 90
    ppm, тревога, работник под экспозицией. Вторая, тихая: после поверки уровнемер VE-LP завис на текущем
    показании; регулятор постепенно переполняет ресивер, и через ~26 минут жидкость уносится на всас --
    влажный ход. Замирание происходит в разгар газовой суеты, после плановой сверки. Указатель уровня,
    единственный источник правды, находится в загазованной зоне.'
  trap: Утечка притягивает всё внимание и обоих работников. Показание уровня выглядит правдоподобно и
    стабильно именно потому, что датчик мёртв; расхождение с фактом растёт молча. Аварийный останов спасает
    от влажного хода, но ценой полной остановки и разморозки камер.
