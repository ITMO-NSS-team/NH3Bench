truth:
  title: 'Ловушка локализации: утечка и заглушенный клапан'
  hazard: 'Сальниковая утечка на напорной линии подачи EV-01 в машзале, около 95 ppm: ниже уставки аварийной
    вентиляции, но обходчик набирает токсическую дозу за ~16 минут. Скрытая вторая опасность: если отсечь
    линию С ОБЕИХ сторон (сосуд арматурой, змеевик клапаном подачи -- в том числе аварийным остановом),
    заперается жидкостный участок без паровой подушки. Гидростатической защиты нет -- клапан заглушен.
    Прогрев тёплым воздухом машзала поднимает давление на ~9 бар/К, и через ~15 минут участок разрушается.'
  trap: 'Правильная локализация несимметрична: отсечь сосуд -- да, закрыть подачу на змеевике -- НЕТ,
    путь в испаритель должен остаться. Регламентный рефлекс «останов + отсечь всё» запирает участок и
    превращает устранённую утечку в разрыв. Предупреждение лежит в сменном журнале с самого начала.'
