truth:
  title: 'Классика: зависшая оттайка после провала питания'
  hazard: 'Секвенсор оттайки завис: стадия не продвигается, змеевик стоит под горячим паром 10 бар с прогретым
    металлом, камера тем временем отогрелась и требует холода. Через десять минут контроллер сбрасывает
    состояние в «охлаждение», подача открывается -- конденсационный гидроудар и разрыв.'
  trap: 'Дистанционное прерывание оттайки идёт через тот же зависший секвенсор и молча перекрывается им:
    на следующем опросе режим снова HOTGAS. Нужно заметить, что команда не исполнилась, и уйти на другой
    маршрут -- закрыть подачу.'
