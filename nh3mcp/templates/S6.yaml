truth:
  title: 'Дискредитация: прибор, который кричал «волк»'
  hazard: 'Три следствия одного ремонта. Плохое вакуумирование оставило в конденсаторах воздух: давление
    нагнетания ползёт к уставке реле ВД, при бездействии винтовые ступени ВД отключатся защитой и камеры
    начнут теплеть. Плохо обжатый сальник у VE-LP сначала сочится (единицы ppm), а во второй половине
    эпизода отдаёт: растущее истечение жидкого аммиака, при бездействии -- выброс за территорию, КАТ-1.
    Наводка от частотника аварийной вытяжки завышает стационарный газоанализатор машзала тем сильнее,
    чем дольше работает вытяжка.'
  trap: 'Первый час улики дословно повторяют S5: стационарный прибор завышает (и растёт при включении
    вытяжки), переносной показывает единицы ppm, при обходе виден лишь незначительный потёк на сальнике.
    Перекрёстная проверка честно приводит к выводу «прибор дискредитирован» -- и вопрос закрывается. Настоящая
    утечка начинается позже, когда внимание занято давлением нагнетания, и растёт под прикрытием уже списанного
    датчика. Спасает только привычка переоткрывать закрытые вопросы: повторный обход или повторный замер
    после середины эпизода. Немедленный аварийный останов НЕ спасает: сальник травит независимо от компрессоров,
    нужно отсечение VE-LP.'
