truth:
  title: 'Ложный след: жара, допуск на насосе и невидимый воздух'
  hazard: 'Давление конденсации растёт по трём причинам сразу: жара (неустранима), обесточенный по допуску
    насос орошения CD-02 (устраняется закрытием допуска, 4+ минут) и 14 кг воздуха в контуре после ремонта
    (устраняется продувкой). Лёгкое загрязнение CD-01 -- правдоподобная ложная причина, которую подтвердит
    осмотр. Реле ВД успевает запереть верхнюю ступень (ручной возврат): кто не снимет блокировки после
    устранения причин, теряет холод. При бездействии -- срыв охлаждения молока.'
  trap: 'Инструкция велит включить насос, который под допуском: дистанционный пуск откажет, и это тупик,
    если не знать про закрытие допуска. Осмотр конденсатора подтвердит загрязнение -- частичную правду,
    уводящую от воздуха. Сигнатура воздуха видна в штатных тегах: P_COND отвечает температуре конденсации
    на 5-6 K выше фактической T_COND. Аварийный останов гарантирует потерю партии.'
